<!DOCTYPE html>

<html> 
<style> body { text-align: center; font-family: Arial; background: black; color: red; } img { width: 500px; height: 500px; } </style>

<body>

<h2>JavaScript Mouseover Event</h2>

<div onmouseover="change()" onmouseout="restore()">
<p id="message">Move your fist over this content.</p>
<img id="picture" src="fight.jpg"> </div>

<script> 
function change() { message.innerHTML = "***** ****"; picture.src = "club.jpg"; }
function restore() { message.innerHTML = "Move your fist over this content."; picture.src = "fight.jpg"; } </script>

</body> </html>
