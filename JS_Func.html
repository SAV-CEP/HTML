<html>
<head>
    <title>String and Math Objects</title>
</head>
<body>
  
  <h2>JavaScript String and Math Objects</h2>

   <script>
        let text = "Hello JavaScript";

        document.write("<h3>String Functions</h3>");

        document.write("Length: " + text.length + "<br>");

        document.write("Uppercase: " + text.toUpperCase() + "<br>");

        document.write("Lowercase: " + text.toLowerCase() + "<br>");

        document.write("Character at position 1: " + text.charAt(1) + "<br>");

        document.write("Contains 'Java': " + text.includes("Java") + "<br>");

        // ---------------- MATH OBJECT ----------------

        let number = 25.7;

        document.write("<h3>Math Functions</h3>");

        document.write("Round: " + Math.round(number) + "<br>");

        document.write("Floor: " + Math.floor(number) + "<br>");

        document.write("Ceil: " + Math.ceil(number) + "<br>");

        document.write("Square root of 25: " + Math.sqrt(25) + "<br>");

        document.write("2 power 3: " + Math.pow(2, 3) + "<br>");

        document.write("Maximum: " + Math.max(10, 20, 30) + "<br>");

        document.write("Minimum: " + Math.min(10, 20, 30) + "<br>");

        document.write("Random number: " + Math.random() + "<br>");
    </script>

</body>
</html>
